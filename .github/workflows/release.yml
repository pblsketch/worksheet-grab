name: Release teacher bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit tests
        run: npm run test:unit
      - name: Build teacher bundle
        run: node scripts/build-user-bundle.mjs dist/worksheet-grab-user
      - name: Create ZIP
        shell: bash
        run: |
          cd dist/worksheet-grab-user
          zip -qr "../worksheet-grab-user-${GITHUB_REF_NAME}.zip" .
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/worksheet-grab-user-${GITHUB_REF_NAME}.zip" \
            --prerelease \
            --title "worksheet-grab ${GITHUB_REF_NAME} (Beta)" \
            --notes "Teacher distribution bundle for the beta release. Extract the ZIP, open the folder in a supported AI harness, and review generated worksheets before classroom use."
